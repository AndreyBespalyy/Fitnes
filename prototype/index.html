<title>Клубная ОС — прототип</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: верхняя панель «роль + клуб», ниже рабочая область роли; менеджер — в рамке телефона, остальные — на ширину экрана */
:root{
  --bg:#F3F6F6; --surface:#FFFFFF; --surface-2:#E9EFEF; --line:#D5DFDE;
  --ink:#13232A; --muted:#5B6E73; --accent:#0E7C74; --accent-ink:#FFFFFF; --accent-soft:#D8EEEC;
  --warm:#C9821F; --warm-soft:#FBEBD2;
  --ok:#1F8A4C; --ok-soft:#DDF2E5; --warn:#B7791F; --warn-soft:#FBEED4; --bad:#C2413A; --bad-soft:#F9E0DE;
  --f-head:"Onest",system-ui,sans-serif; --f-body:"Onest",system-ui,sans-serif; --f-num:"JetBrains Mono",ui-monospace,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1719; --surface:#162226; --surface-2:#1D2C31; --line:#2A3C42;
  --ink:#E4EDEE; --muted:#93A7AC; --accent:#3BB3A8; --accent-ink:#06201D; --accent-soft:#163B38;
  --warm:#E3A64E; --warm-soft:#3A2C17;
  --ok:#4CC27E; --ok-soft:#173327; --warn:#E3A64E; --warn-soft:#3A2C17; --bad:#EE7A72; --bad-soft:#3D1F1D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1719; --surface:#162226; --surface-2:#1D2C31; --line:#2A3C42;
  --ink:#E4EDEE; --muted:#93A7AC; --accent:#3BB3A8; --accent-ink:#06201D; --accent-soft:#163B38;
  --warm:#E3A64E; --warm-soft:#3A2C17;
  --ok:#4CC27E; --ok-soft:#173327; --warn:#E3A64E; --warn-soft:#3A2C17; --bad:#EE7A72; --bad-soft:#3D1F1D; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-head);margin:0;text-wrap:balance}
h1{font-size:22px;font-weight:800;letter-spacing:-.01em}
h2{font-size:16px;font-weight:700}
h3{font-size:14px;font-weight:600}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}

/* верхняя панель */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);color:var(--bg);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
.brand{font-family:var(--f-head);font-weight:800;font-size:16px;display:flex;gap:8px;align-items:center}
.brand i{width:22px;height:22px;border-radius:6px;background:var(--accent);display:inline-block;position:relative}
.brand i::after{content:"";position:absolute;inset:6px 4px;border-top:3px solid var(--bg);border-bottom:3px solid var(--bg)}
.top .ctl{display:flex;gap:6px;align-items:center;font-size:12px}
.top select{background:transparent;border:1px solid color-mix(in srgb,var(--bg) 35%,transparent);border-radius:8px;padding:5px 8px;color:var(--bg)}
.top select option{color:#13232A}
.top .demo{margin-left:auto;font-size:11px;opacity:.75}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px;max-width:1240px;margin:0 auto}

/* общие элементы */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--warm);outline-offset:2px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.acc{background:var(--accent-soft);color:var(--accent)}
.kpi .v{font-family:var(--f-num);font-size:24px;font-weight:600;letter-spacing:-.02em;margin-top:4px}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.bar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-top:8px}
.bar b{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.warn b{background:var(--warn)} .bar.bad b{background:var(--bad)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:right}
.fresh{font-size:11px;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.sect{display:grid;gap:12px;margin-top:16px}
.head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:end;justify-content:space-between}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:6px 10px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:600}
.tabs button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.note{font-size:12px;color:var(--muted);border-left:3px solid var(--warm);padding:4px 10px;background:var(--warm-soft);border-radius:0 6px 6px 0}
.ai{border:1px dashed var(--accent);background:var(--accent-soft)}
.ai .lbl{color:var(--accent)}
input[type=text],input[type=tel],input[type=email],select.f{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px}
label.fl{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}

/* телефон менеджера */
.phoneWrap{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start}
.phone{width:390px;max-width:100%;background:var(--surface);border:1px solid var(--line);border-radius:28px;overflow:hidden;box-shadow:0 10px 30px -18px rgba(0,0,0,.35);display:flex;flex-direction:column;height:760px;max-height:calc(100vh - 120px);min-height:560px}
.ph-top{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.ph-body{flex:1;overflow-y:auto;padding:12px 14px;display:grid;gap:10px;align-content:start}
.ph-nav{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line)}
.ph-nav button{border:0;background:transparent;padding:10px 4px 12px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer}
.ph-nav button[aria-current="true"]{color:var(--accent)}
.task{display:grid;grid-template-columns:4px 1fr auto;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;text-align:left;width:100%}
.task .stripe{align-self:stretch;border-radius:4px;background:var(--line)}
.task .stripe.hot{background:var(--bad)} .task .stripe.warm{background:var(--warn)} .task .stripe.cold{background:var(--accent)}
.task .t{font-weight:600}
.task .why{font-size:12px;color:var(--muted)}
.side{flex:1;min-width:260px;max-width:520px;display:grid;gap:12px}
.cat{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:12px}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.steps span{font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.steps span.on{background:var(--accent);color:var(--accent-ink)}
.scan{display:grid;place-items:center;gap:6px;padding:22px;border-radius:12px;text-align:center}
.scan.ok{background:var(--ok-soft);color:var(--ok)} .scan.bad{background:var(--bad-soft);color:var(--bad)}
.scan .big{font-family:var(--f-head);font-size:22px;font-weight:800}
@media (max-width:440px){.phone{border-radius:16px;height:auto;max-height:none}.ph-body{overflow:visible}}
@media (prefers-reduced-motion:no-preference){.fade{animation:f .25s ease}@keyframes f{from{opacity:.4;transform:translateY(3px)}to{opacity:1;transform:none}}}
</style>

<header class="top">
  <div class="brand"><i></i>Клубная ОС</div>
  <div class="ctl"><label for="role">Роль</label>
    <select id="role">
      <option value="owner">Собственник</option>
      <option value="manager">Менеджер ОП</option>
      <option value="rop">Руководитель ОП</option>
      <option value="gm">Управляющий</option>
      <option value="desk">Ресепшн</option>
      <option value="fin">Финансист</option>
      <option value="admin">Администратор системы</option>
    </select></div>
  <div class="ctl"><label for="club">Клуб</label><select id="club"></select></div>
  <div class="demo">Прототип · тестовые данные</div>
</header>
<main class="wrap" id="app"></main>
<div class="toast" id="toast" hidden></div>

<script>
/* ---------- тестовые данные ---------- */
const S = {
  clubs:[
    {id:'c1',name:'Клуб «Центр»',city:'Москва, ул. Тверская, 12',tz:'Europe/Moscow',model:'term'},
    {id:'c2',name:'Клуб «Север»',city:'Москва, Дмитровское ш., 89',tz:'Europe/Moscow',model:'sub'}
  ],
  staff:[
    {id:1,name:'Андрей Беспалый',role:'owner',clubs:['*'],active:true},
    {id:2,name:'Ирина Котова',role:'admin',clubs:['*'],active:true},
    {id:3,name:'Олег Смирнов',role:'gm',clubs:['c1'],active:true},
    {id:4,name:'Ольга Астафьева',role:'rop',clubs:['c1'],active:true},
    {id:5,name:'Мария Волкова',role:'manager',clubs:['c1'],active:true},
    {id:6,name:'Дарья Лис',role:'desk',clubs:['c1'],active:true},
    {id:7,name:'Екатерина Орлова',role:'fin',clubs:['c1'],active:true},
    {id:8,name:'Артём Ким',role:'trainer',clubs:['c1'],active:true},
    {id:9,name:'Сергей Павлов',role:'gm',clubs:['c2'],active:true},
    {id:10,name:'Наталья Белова',role:'rop',clubs:['c2'],active:true},
    {id:11,name:'Игорь Зуев',role:'manager',clubs:['c2'],active:true},
    {id:12,name:'Алина Морозова',role:'desk',clubs:['c2'],active:true},
    {id:13,name:'Виктор Гусев',role:'fin',clubs:['c2'],active:true},
    {id:14,name:'Полина Ершова',role:'trainer',clubs:['c2'],active:true}
  ]
};
const ROLES={owner:'Собственник',admin:'Администратор системы',gm:'Управляющий',rop:'Руководитель ОП',manager:'Менеджер ОП',desk:'Администратор ресепшн',fin:'Финансист',trainer:'Тренер'};
const MODEL={term:'Абонементы на срок',sub:'Подписка (ежемесячное списание)'};

/* данные по модели продаж */
const BY_MODEL={
  term:{
    cats:[['Новые клиенты',420000,268000],['Продления',610000,402000],['Возобновление бывших',180000,77000],['Персональные тренировки',150000,96000]],
    avgLabel:'Средневзвешенный абонемент',avg:'38 400 ₽',
    clients:[
      {n:'Алексей Громов',cat:'На продление',why:'Абонемент «Год» заканчивается через 5 дней. Был 46 раз за год',act:'Позвонить, предложить продление со сдвигом от даты окончания',heat:'hot',sum:'42 000 ₽',ph:'+7 916 ***-**-21'},
      {n:'Светлана Юдина',cat:'Лид',why:'Заявка с сайта 18 мин назад, источник: Яндекс.Директ',act:'Перезвонить сейчас — превышена норма первого ответа',heat:'hot',sum:'38 400 ₽',ph:'+7 903 ***-**-08'},
      {n:'Павел Рябов',cat:'Был на встрече',why:'Встреча 3 дня назад, сказал «подумаю», возражение — цена',act:'Предложить рассрочку на 3 месяца',heat:'warm',sum:'36 000 ₽',ph:'+7 926 ***-**-55'},
      {n:'Елена Миронова',cat:'Бывший член клуба',why:'Абонемент закончился 2 месяца назад, ходила 3 раза в неделю',act:'Возобновление: акция «вернись осенью» −10%',heat:'warm',sum:'34 560 ₽',ph:'+7 985 ***-**-14'},
      {n:'Кирилл Демин',cat:'Гость',why:'Гостевой визит вчера, понравился зал единоборств',act:'Пригласить на пробную персональную тренировку',heat:'cold',sum:'—',ph:'+7 915 ***-**-90'}
    ]},
  sub:{
    cats:[['Новые подписки',380000,251000],['Возврат отписавшихся',140000,52000],['Удержание (без отписок)',520000,489000],['Персональные тренировки',120000,71000]],
    avgLabel:'Средняя подписка в месяц',avg:'4 900 ₽',
    clients:[
      {n:'Тимур Ахметов',cat:'Списание не прошло',why:'Не прошло списание 2 900 ₽, карта просрочена. Попытка 2 из 3',act:'Отправить ссылку на смену карты в Telegram',heat:'hot',sum:'4 900 ₽/мес',ph:'+7 977 ***-**-31'},
      {n:'Анна Ковалёва',cat:'Лид',why:'Заявка из Telegram 9 мин назад: «сколько стоит подписка?»',act:'Ответить и пригласить на гостевой визит',heat:'hot',sum:'4 900 ₽/мес',ph:'+7 905 ***-**-77'},
      {n:'Роман Фёдоров',cat:'Риск отписки',why:'Не был 19 дней, раньше ходил 3 раза в неделю',act:'Позвонить, предложить заморозку вместо отписки',heat:'warm',sum:'4 900 ₽/мес',ph:'+7 916 ***-**-46'},
      {n:'Ксения Лаптева',cat:'Отписавшийся',why:'Отписалась 40 дней назад, причина — переезд в другой район. Клуб «Центр» рядом с новым адресом',act:'Предложить перейти в клуб «Центр» сети',heat:'warm',sum:'4 900 ₽/мес',ph:'+7 999 ***-**-12'},
      {n:'Глеб Орлов',cat:'Гость',why:'Пришёл по QR-анкете на ресепшн 2 дня назад',act:'Звонок-знакомство, первый месяц 990 ₽',heat:'cold',sum:'990 ₽',ph:'+7 925 ***-**-65'}
    ]}
};
const MGRS={c1:[['Мария Волкова','ok',92,31,12],['Анна Ли','ok',81,27,9],['Пётр Нос','warn',63,22,6],['Максим Ульев','bad',41,14,3]],
            c2:[['Игорь Зуев','ok',88,29,10],['Вера Сомова','warn',66,20,5],['Денис Агеев','bad',38,11,2]]};
const DAY={c1:{sales:186400,cash:171900,exp:42300,visits:612,leads:38,conv:24},c2:{sales:97300,cash:112600,exp:31800,visits:448,leads:29,conv:21}};

let st={role:'owner',club:'c1',mTab:'home',client:null,sale:0,deskRes:null,adminTab:'clubs',wiz:null,approvals:[
  {id:1,what:'Возврат 18 500 ₽ — Громова Т. (переезд), остаток после заморозки',who:'Олег Смирнов, управляющий',club:'c1',lim:'выше лимита управляющего 15 000 ₽'},
  {id:2,what:'Расход 64 000 ₽ — ремонт беговой дорожки №4',who:'Сергей Павлов, управляющий',club:'c2',lim:'выше лимита 50 000 ₽'}]};

/* ---------- утилиты ---------- */
const $=s=>document.querySelector(s);
const rub=n=>n.toLocaleString('ru-RU')+' ₽';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const club=()=>S.clubs.find(c=>c.id===st.club)||S.clubs[0];
const data=()=>BY_MODEL[club().model];
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2600)}
function nowStr(){const d=new Date();return d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}
function pct(f,p){return Math.round(f/p*100)}
function barCls(p){return p>=85?'':p>=60?'warn':'bad'}
function fillClubs(){const sel=$('#club');const all=['owner','admin'].includes(st.role);
  sel.innerHTML=(all?'<option value="all">Вся сеть</option>':'')+S.clubs.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');
  if(!all&&st.club==='all')st.club='c1'; sel.value=st.club;}

/* ---------- экраны ---------- */
function planBlock(compact){
  const d=data();
  return d.cats.map(([n,p,f])=>{const pc=pct(f,p);return `<div>
    <div class="row between"><span>${n}</span><span class="num">${pc}%</span></div>
    <div class="bar ${barCls(pc)}"><b style="width:${Math.min(pc,100)}%"></b></div>
    ${compact?'':`<div class="row between fresh"><span>факт ${rub(f)}</span><span>план ${rub(p)} · дефицит ${rub(Math.max(p-f,0))}</span></div>`}
  </div>`}).join('');
}
function ownerView(){
  const ids=st.club==='all'?S.clubs.map(c=>c.id):[st.club];
  const sum=k=>ids.reduce((a,i)=>a+((DAY[i]||{sales:0,cash:0,exp:0,visits:0,leads:0,conv:0})[k]),0);
  const sales=sum('sales'),cash=sum('cash'),exp=sum('exp');
  const title=st.club==='all'?'Вся сеть':club().name;
  const appr=st.approvals.filter(a=>st.club==='all'||a.club===st.club);
  return `<div class="head"><div><div class="lbl">Эффективность дня</div><h1>${esc(title)}</h1></div>
    <div class="fresh">Продажи и деньги обновлены в ${nowStr()} · раз в минуту</div></div>
  <div class="grid g4 sect">
    <div class="card kpi"><div class="lbl">Продажи сегодня</div><div class="v">${rub(sales)}</div><div class="s">план дня ${rub(Math.round(sales*1.12))}</div></div>
    <div class="card kpi"><div class="lbl">Поступления</div><div class="v">${rub(cash)}</div><div class="s">касса, эквайринг, СБП, банк</div></div>
    <div class="card kpi"><div class="lbl">Расходы</div><div class="v">${rub(exp)}</div><div class="s">утверждённые за день</div></div>
    <div class="card kpi"><div class="lbl">Результат дня</div><div class="v" style="color:var(--ok)">${rub(cash-exp)}</div><div class="s">поступления − расходы</div></div>
    <div class="card kpi"><div class="lbl">Посещения</div><div class="v">${sum('visits')}</div><div class="s">уникальных клиентов</div></div>
    <div class="card kpi"><div class="lbl">Новые лиды</div><div class="v">${sum('leads')}</div><div class="s">конверсия в покупку ${Math.round(sum('conv')/ids.length)}%</div></div>
  </div>
  <div class="grid g2 sect">
    <div class="card"><div class="row between"><h2>План месяца по категориям</h2>${st.club==='all'?'':`<span class="chip acc">${MODEL[club().model]}</span>`}</div>
      <div class="grid" style="margin-top:10px">${st.club==='all'?'<p class="muted">Выберите клуб, чтобы увидеть категории плана: у клубов разные модели продаж.</p>':planBlock()}</div></div>
    <div class="card"><h2>Ждут вашего решения</h2>
      <div class="grid" style="margin-top:10px">${appr.length?appr.map(a=>`<div class="card" style="background:var(--surface-2)">
        <div style="font-weight:600">${esc(a.what)}</div><div class="fresh">${esc(a.who)} · ${esc(a.lim)}</div>

function saleFlow(k){

  const head=`<div class="steps">${steps.map((s,i)=>`<span class="${i<st.sale?'on':''}">${i+1}. ${s}</span>`).join('')}</div>`;
  const tariffs=sub?[['Подписка «Безлимит»','4 900 ₽/мес'],['Подписка «Дневная»','3 400 ₽/мес'],['Первый месяц для новых','990 ₽']]:[['Абонемент «Год»','42 000 ₽'],['Абонемент «Полгода»','25 800 ₽'],['Рассрочка «Год», 3 платежа','3 × 14 000 ₽']];
  if(st.sale===1)return `<button class="btn sm" data-back>← Карточка</button><h2>Продажа: ${esc(k.n)}</h2>${head}
    ${tariffs.map((t,i)=>`<button class="task" data-sale-next><span class="stripe ${i===0?'hot':'cold'}"></span><span><span class="t">${t[0]}</span>${i===0?'<br><span class="why">рекомендовано ИИ по истории клиента</span>':''}</span><span class="num">${t[1]}</span></button>`).join('')}
    ${sub?'':'<p class="fresh">Продление считается от даты окончания текущего абонемента, клиент не теряет дни.</p>'}`;
  if(st.sale===2)return `${head}<div class="card"><div class="lbl">Договор собран из карточки</div><p style="margin:6px 0">Договор оказания услуг № ${sub?'С':'Ц'}-2026-1184 · ${esc(k.n)} · ${tariffs[0][0]} · ${tariffs[0][1]}</p><p class="fresh">Шаблон «${sub?'Подписка':'Абонемент'} v3», утверждён юристом 02.11.2026</p></div><button class="btn pri" data-sale-next>Отправить на подпись</button>`;

  if(st.adminTab==='clubs'){
    if(st.wiz){body=wizard()}else{
    body=`<div class="row between"><p class="muted" style="margin:0">У каждого клуба своя модель продаж. От неё зависят категории плана, воронки, тарифы и показатели.</p><button class="btn pri" data-wiz>+ Новый клуб</button></div>
    <div class="grid g2" style="margin-top:12px">${S.clubs.map(c=>`<div class="card"><div class="row between"><h2>${esc(c.name)}</h2><span class="chip acc">${c.model==='sub'?'подписка':'абонементы'}</span></div>
      <p class="muted" style="margin:4px 0 10px">${esc(c.city)} · ${S.staff.filter(s=>s.clubs.includes(c.id)).length} сотрудников</p>
      <label class="fl" for="m-${c.id}">Модель продаж<select class="f" id="m-${c.id}" data-model="${c.id}"><option value="term" ${c.model==='term'?'selected':''}>${MODEL.term}</option><option value="sub" ${c.model==='sub'?'selected':''}>${MODEL.sub}</option></select></label>
      <p class="fresh" style="margin-top:6px">При смене модели действующие договоры сохраняют свои условия.</p></div>`).join('')}</div>`}
  } else {
    body=`<div class="card"><h2>Добавить сотрудника</h2><div class="grid g4" style="margin-top:8px;align-items:end">
      <label class="fl" for="n-name">ФИО<input id="n-name" type="text" placeholder="Иванов Иван"></label>
      <label class="fl" for="n-role">Роль<select class="f" id="n-role">${Object.entries(ROLES).filter(([k])=>k!=='owner').map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label>
      <label class="fl" for="n-club">Клуб<select class="f" id="n-club">${S.clubs.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}<option value="*">Вся сеть</option></select></label>
      <button class="btn pri" data-addstaff>Добавить</button></div></div>
    <div class="card" style="margin-top:12px"><div class="tbl"><table><thead><tr><th>Сотрудник</th><th>Роль</th><th>Клубы</th><th>Статус</th><th></th></tr></thead><tbody>
    ${S.staff.map(s=>`<tr><td>${esc(s.name)}</td><td>${ROLES[s.role]}</td><td>${s.clubs[0]==='*'?'Вся сеть':s.clubs.map(i=>esc(S.clubs.find(c=>c.id===i)?.name||'')).join(', ')}</td><td>${s.active?'<span class="chip ok">активен</span>':'<span class="chip">заблокирован</span>'}</td><td class="r">${s.role==='owner'?'':`<button class="btn sm" data-block="${s.id}">${s.active?'Заблокировать':'Вернуть'}</button>`}</td></tr>`).join('')}
    </tbody></table></div><p class="fresh">Заблокированный сотрудник не может войти, его история и клиенты сохраняются.</p></div>`;
  }
  return `<div class="head"><div><div class="lbl">Настройки сети</div><h1>Администратор системы</h1></div>${tabs}</div><div class="sect">${body}</div>`;
}
function wizard(){const w=st.wiz;
  const head=`<div class="steps">${['Клуб','Модель продаж','Готовые настройки'].map((s,i)=>`<span class="${i<=w.step?'on':''}">${i+1}. ${s}</span>`).join('')}</div>`;
  if(w.step===0)return `<div class="card" style="max-width:560px">${head}<h2>Новый клуб</h2><div class="grid" style="margin-top:10px;gap:10px">
    <label class="fl" for="w-name">Название<input id="w-name" type="text" value="${esc(w.name)}" placeholder="Клуб «Юг»"></label>
    <label class="fl" for="w-addr">Адрес<input id="w-addr" type="text" value="${esc(w.addr)}" placeholder="Город, улица, дом"></label>
    <label class="fl" for="w-tz">Часовой пояс<select class="f" id="w-tz"><option>Europe/Moscow (МСК)</option><option>Asia/Yekaterinburg (МСК+2)</option><option>Asia/Novosibirsk (МСК+4)</option></select></label>
    <div class="row"><button class="btn" data-wiz-cancel>Отмена</button><button class="btn pri" data-wiz-next>Далее</button></div></div></div>`;
  if(w.step===1)return `<div class="card" style="max-width:560px">${head}<h2>По какой модели продаёт клуб?</h2><p class="fresh">Выбор обязателен. Позже его можно изменить в карточке клуба.</p>
    <div class="grid" style="margin-top:10px;gap:8px">${['term','sub'].map(m=>`<button class="task" data-wiz-model="${m}" aria-pressed="${w.model===m}" style="${w.model===m?'border-color:var(--accent);background:var(--accent-soft)':''}"><span class="stripe ${w.model===m?'cold':''}"></span><span><span class="t">${MODEL[m]}</span><br><span class="why">${m==='term'?'Категории плана: новые, продления, возобновление бывших':'Категории плана: новые подписки, возврат отписавшихся, удержание; показатели: регулярная выручка и отток'}</span></span><span></span></button>`).join('')}</div>
    <div class="row" style="margin-top:10px"><button class="btn" data-wiz-back>Назад</button><button class="btn pri" data-wiz-next ${w.model?'':'disabled'}>Далее</button></div></div>`;
  return `<div class="card" style="max-width:560px">${head}<h2>Готовые настройки</h2><p class="muted">Для модели «${MODEL[w.model]}» будут созданы примеры тарифов, воронки и категории плана. Их можно поменять после создания.</p>
    <div class="row" style="margin-top:10px"><button class="btn" data-wiz-back>Назад</button><button class="btn pri" data-wiz-done>Создать клуб</button></div></div>`;
}

/* ---------- отрисовка и события ---------- */
function render(){
  fillClubs();
  const v={owner:ownerView,manager:managerView,rop:ropView,gm:gmView,desk:deskView,fin:finView,admin:adminView}[st.role];
  if(st.club==='all'&&!['owner','admin'].includes(st.role))st.club='c1';
  if(st.club==='all'&&st.role==='admin'){}
  $('#app').innerHTML=v();
}
$('#role').addEventListener('change',e=>{st.role=e.target.value;st.client=null;st.sale=0;st.mTab='home';st.deskRes=null;if(!['owner','admin'].includes(st.role)&&st.club==='all')st.club='c1';render()});
$('#club').addEventListener('change',e=>{st.club=e.target.value;st.client=null;st.sale=0;st.deskRes=null;render()});
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;const d=t.dataset;
  if(d.toast){toast(d.toast);return}
  if(d.mtab){st.mTab=d.mtab;st.client=null;st.sale=0}
  else if(d.client!==undefined){st.client=+d.client;st.sale=0}
  else if('back' in d){if(st.sale>0)st.sale=0;else st.client=null}
  else if('backHome' in d){st.client=null;st.sale=0;st.mTab='home'}
  else if('call' in d){toast('Звонок через АТС клуба · запись включена');return}
  else if('sale' in d){st.sale=1}
  else if('saleNext' in d){st.sale++;if(st.sale===5)toast('Сделка выиграна, план дня обновлён')}
  else if('close' in d){toast('Нельзя закрыть карточку: поставьте следующую задачу или закройте сделку');return}
  else if(d.appr){const ok=d.ok;st.approvals=st.approvals.filter(a=>a.id!==+d.appr);toast(ok?'Утверждено после подтверждения кодом':'Отклонено, инициатор получил уведомление')}
  else if(d.scan){const m={ok:{ok:true,t:'Абонемент активен до 14.08.2027'},frozen:{ok:false,t:'Абонемент заморожен до 15.12.2026',a:['Разморозить']},debt:{ok:false,t:club().model==='sub'?'Не прошло списание за ноябрь, долг 4 900 ₽':'Просрочен платёж по рассрочке, долг 14 000 ₽',a:['Принять оплату']},club:{ok:false,t:'Тариф действует только в клубе «'+(st.club==='c1'?'Север':'Центр')+'»',a:['Сменить тариф']}};st.deskRes=m[d.scan]}
  else if(d.atab){st.adminTab=d.atab;st.wiz=null}
  else if('wiz' in d){st.wiz={step:0,name:'',addr:'',model:null}}
  else if('wizCancel' in d){st.wiz=null}
  else if('wizNext' in d){if(st.wiz.step===0){st.wiz.name=$('#w-name').value.trim();st.wiz.addr=$('#w-addr').value.trim();if(!st.wiz.name){toast('Укажите название клуба');return}}st.wiz.step++}
  else if('wizBack' in d){st.wiz.step--}
  else if(d.wizModel){st.wiz.model=d.wizModel}
  else if('wizDone' in d){const id='c'+(S.clubs.length+1);S.clubs.push({id,name:st.wiz.name,city:st.wiz.addr||'адрес не указан',tz:'Europe/Moscow',model:st.wiz.model});DAY[id]={sales:0,cash:0,exp:0,visits:0,leads:0,conv:0};MGRS[id]=[];toast('Клуб «'+st.wiz.name+'» создан');st.wiz=null}
  else if('addstaff' in d){const n=$('#n-name').value.trim();if(!n){toast('Укажите ФИО сотрудника');return}S.staff.push({id:Date.now(),name:n,role:$('#n-role').value,clubs:[$('#n-club').value],active:true});toast('Сотрудник добавлен, приглашение отправлено по SMS')}
  else if(d.block){const s=S.staff.find(x=>x.id===+d.block);s.active=!s.active;toast(s.active?'Доступ возвращён':'Сотрудник заблокирован, история сохранена')}
  else return;
  render();
});
document.addEventListener('change',e=>{const m=e.target.dataset?.model;if(m){const c=S.clubs.find(x=>x.id===m);c.model=e.target.value;toast('Модель продаж изменена: '+MODEL[c.model]);render()}});
render();
</script>
