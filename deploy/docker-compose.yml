# Тестовый сервер: база, приложение и Caddy (HTTPS-сертификаты Let's Encrypt выпускаются сами)
name: fitnes
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 20
  app:
    build: ..
    restart: unless-stopped
    env_file: .env
    environment:
      ADMIN_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
      OWNER_DATABASE_URL: postgres://fitnes_owner:${DB_OWNER_PASSWORD}@db:5432/fitnes
      DATABASE_URL: postgres://fitnes_app:${DB_APP_PASSWORD}@db:5432/fitnes
      COOKIE_SECURE: "1"
      APP_VERSION: ${APP_VERSION:-}
      BACKUP_DIR: /backups
    volumes:
      - storage:/data/storage
      # Папка резервных копий сервера — только для чтения: раздел «Состояние системы» проверяет, что ночная копия сделана
      - /opt/fitnes-backups:/backups:ro
    depends_on:
      db:
        condition: service_healthy
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - app
volumes:
  dbdata:
  storage:
  caddydata:
  caddyconfig:
