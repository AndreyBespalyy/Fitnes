# Тестовый сервер: база, приложение и Caddy (HTTPS-сертификаты Let's Encrypt выпускаются сами)
name: fitnes
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 20
  app:
    build: ..
    restart: unless-stopped
    env_file: .env
    environment:
      ADMIN_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
      OWNER_DATABASE_URL: postgres://fitnes_owner:${DB_OWNER_PASSWORD}@db:5432/fitnes
      DATABASE_URL: postgres://fitnes_app:${DB_APP_PASSWORD}@db:5432/fitnes
      COOKIE_SECURE: "1"
    volumes:
      - storage:/data/storage
    depends_on:
      db:
        condition: service_healthy
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - app
  # ИИ для звонков без видеокарты (выбор Андрея 14.11.2026): расшифровка Whisper и итоги небольшой моделью
  # на процессоре этого же сервера. Записи и тексты никуда не уходят. Включается строкой COMPOSE_PROFILES=ai
  # в deploy/.env (вместе с AI_URL=http://ai:8100 и AI_TOKEN), см. deploy/ai/README.md.
  # cpu_shares ниже, чем у CRM: если процессор занят, CRM отвечает первой, а звонки ждут.
  ai-llm:
    image: ghcr.io/ggml-org/llama.cpp:server-b12004
    profiles: ["ai"]
    restart: unless-stopped
    command: ["--host", "0.0.0.0", "--port", "8080",
      "--hf-repo", "${AI_LLM_REPO:-bartowski/Qwen2.5-7B-Instruct-GGUF}", "--hf-file", "${AI_LLM_FILE:-Qwen2.5-7B-Instruct-Q4_K_M.gguf}",
      "--ctx-size", "16384", "--parallel", "1", "--jinja", "--api-key", "${AI_LLM_KEY:-local}"]
    environment:
      LLAMA_CACHE: /models
    volumes:
      - aillm:/models
    cpu_shares: 256
    mem_limit: 12g
  ai:
    build:
      context: ../services/ai
      dockerfile: Dockerfile.cpu
    profiles: ["ai"]
    restart: unless-stopped
    environment:
      AI_TOKEN: ${AI_TOKEN:-}
      ASR_MODEL: ${AI_ASR_MODEL:-large-v3-turbo}
      ASR_DEVICE: cpu
      ASR_COMPUTE: int8
      ASR_BEAM: "2"
      ASR_THREADS: ${AI_ASR_THREADS:-0}
      ASR_MANAGER_CHANNEL: ${ASR_MANAGER_CHANNEL:-0}
      LLM_URL: http://ai-llm:8080/v1
      LLM_MODEL: ${AI_LLM_FILE:-Qwen2.5-7B-Instruct-Q4_K_M.gguf}
      LLM_KEY: ${AI_LLM_KEY:-local}
      LLM_TIMEOUT: "900"
    volumes:
      - aiwhisper:/models
    cpu_shares: 256
    mem_limit: 6g
    depends_on:
      - ai-llm
volumes:
  aillm:
  aiwhisper:
  dbdata:
  storage:
  caddydata:
  caddyconfig:
